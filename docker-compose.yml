services:
  db:
    image: postgres:15
    container_name: reddit_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: reddit_archive
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d reddit_archive"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/reddit_archive
      DB_USER: user
      DB_PASSWORD: password
      AUTOSHORTS_CLI_ENABLED: "false"
    volumes:
      - ./assets/backgrounds:/app/assets/backgrounds
      - ./output:/app/output

volumes:
  postgres_data:
