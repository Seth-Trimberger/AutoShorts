spring.application.name=scraper

# Connection to Docker Postgres
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/reddit_archive}
spring.datasource.username=${DB_USER:user}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate - This creates the 'stories' table for you automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.sql.init.mode=always

# Video generation pipeline
autoshorts.assets.backgrounds-dir=assets/backgrounds
autoshorts.assets.output-dir=output/videos
autoshorts.assets.audio-dir=output/audio
autoshorts.assets.captions-dir=output/captions

# TTS voices (edge-tts --list-voices)
autoshorts.tts.voice=en-GB-SoniaNeural
autoshorts.tts.provider=edge-tts
autoshorts.tts.edge-tts-command=${EDGE_TTS_COMMAND:edge-tts}
autoshorts.tts.voice-mode=random
autoshorts.tts.voices=en-AU-NatashaNeural,en-GB-RyanNeural,en-GB-SoniaNeural,en-IE-EmilyNeural

# Captions: block | sentence | script_aligned
autoshorts.captions.mode=script_aligned
autoshorts.captions.max-words-per-chunk=6
autoshorts.captions.max-words-per-line=8
autoshorts.captions.max-chars-per-line=42
autoshorts.captions.polish=none

# Video output (1080x1920 works for TikTok, Reels, Shorts, Facebook Reels)
autoshorts.video.width=1080
autoshorts.video.height=1920
autoshorts.video.background-mode=blur_fill
autoshorts.video.blur-strength=20
autoshorts.video.caption-margin-v=120
autoshorts.video.caption-border-style=1
autoshorts.video.caption-outline=3
autoshorts.video.caption-font-size=28

# ffmpeg-full (with libass) required for subtitles; override via FFMPEG_PATH
autoshorts.ffmpeg.path=${FFMPEG_PATH:ffmpeg}
autoshorts.whisper.command=${WHISPER_COMMAND:whisper}
autoshorts.whisper.model=base
